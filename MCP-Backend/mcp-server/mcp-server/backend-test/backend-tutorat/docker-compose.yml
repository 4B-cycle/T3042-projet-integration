# Base PostgreSQL de développement :  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tutorat
      POSTGRES_PASSWORD: tutorat
      POSTGRES_DB: tutorat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
